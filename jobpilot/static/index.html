<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPilot Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M8 16.5 24 9l-4.5 14-3.5-5.5z' fill='%233b82f6'/%3E%3C/svg%3E">
<script>
try{var t=localStorage.getItem('jp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#jobs" aria-label="JobPilot home">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand)"/><path d="M8 16.5 24 9l-4.5 14-3.5-5.5z" fill="#fff"/></svg>
    <span>JobPilot <small>Pro</small></span>
  </a>
  <nav id="nav" aria-label="Main"></nav>
  <div class="grow"></div>
  <div class="leds" id="leds"></div>
  <button class="icon-btn" id="log-btn" title="Activity log" aria-label="Open activity log">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
  </button>
  <button class="theme" id="theme" role="switch" aria-label="Dark mode" aria-checked="false">
    <svg class="sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
    <i class="knob"></i>
  </button>
</header>

<section id="auto" class="autopilot" hidden aria-live="polite"></section>

<main>
  <section id="v-jobs" class="view"></section>
  <section id="v-resume" class="view" hidden></section>
  <section id="v-portals" class="view" hidden></section>
  <section id="v-settings" class="view" hidden></section>
</main>

<div id="dock" class="dock" hidden></div>

<aside id="logpane" class="logpane" hidden>
  <div class="logpane-h"><b>Activity log</b><button class="btn" id="log-close">Close</button></div>
  <pre id="logtext"></pre>
</aside>
<div id="toast" class="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
